<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify OTP</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary:       #6b7f3a;
      --primary-dark:  #4f5e2b;
      --primary-light: #9db558;
      --accent:        #f5a623;

      --card-bg:       rgba(255, 252, 220, 0.85);
      --card-border:   rgba(107, 127, 58, 0.18);
      --card-shadow:   0 20px 60px rgba(79, 94, 43, 0.18), 0 4px 16px rgba(79, 94, 43, 0.1);

      --input-bg:      rgba(255, 255, 255, 0.75);
      --input-border:  rgba(107, 127, 58, 0.25);
      --input-focus:   #6b7f3a;

      --text-dark:     #1e2112;
      --text-mid:      #4a5028;
      --text-muted:    #8a8a6a;

      --radius-pill:   999px;
      --radius-lg:     22px;
      --transition:    0.26s cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Poppins", sans-serif;
      min-height: 100vh;
      background: #fef5c0;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed; top: -120px; right: -100px;
      width: 520px; height: 520px;
      background: radial-gradient(circle, rgba(107,127,58,0.15) 0%, transparent 70%);
      border-radius: 50%;
      animation: driftOrb 12s ease-in-out infinite;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed; bottom: -80px; left: -80px;
      width: 420px; height: 420px;
      background: radial-gradient(circle, rgba(245,166,35,0.14) 0%, transparent 70%);
      border-radius: 50%;
      animation: driftOrb 16s ease-in-out infinite reverse;
      pointer-events: none;
    }
    @keyframes driftOrb {
      0%,100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(-30px) scale(1.06); }
    }

    .container {
      display: flex;
      width: 100%;
      max-width: 1100px;
      align-items: center;
      justify-content: space-between;
      padding: 0 48px;
      gap: 48px;
      animation: fadeUp 0.6s ease-out both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .image-section {
      flex: 1.4;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .image-section img {
      width: 100%;
      max-width: 620px;
      border-radius: var(--radius-lg);
      filter: drop-shadow(0 12px 32px rgba(79,94,43,0.22));
      transition: transform 0.5s ease;
    }
    .image-section img:hover { transform: scale(1.02) translateY(-4px); }

    .card {
      flex: 1;
      max-width: 420px;
      background: var(--card-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      padding: 44px 40px;
      border-radius: var(--radius-lg);
      border: 1.5px solid var(--card-border);
      box-shadow: var(--card-shadow);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--primary-light), var(--accent), var(--primary));
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    }

    h2 {
      color: var(--primary-dark);
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.83rem;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    /* OTP boxes */
    .otp-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }
    .otp-row input {
      width: 48px;
      height: 56px;
      text-align: center;
      font-size: 1.4rem;
      font-weight: 700;
      border-radius: 12px;
      border: 1.5px solid var(--input-border);
      background: var(--input-bg);
      color: var(--text-dark);
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
      caret-color: transparent;
    }
    .otp-row input:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 4px rgba(107,127,58,0.12);
      background: #fff;
    }
    .otp-row input.filled {
      border-color: var(--primary);
      background: #f5f9ec;
    }

    /* Timer */
    .timer {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }
    .timer span {
      font-weight: 600;
      color: var(--primary-dark);
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: var(--radius-pill);
      border: none;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #fff;
      font-family: "Poppins", sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform var(--transition), box-shadow var(--transition), opacity var(--transition);
      box-shadow: 0 4px 14px rgba(79,94,43,0.25);
    }
    button:disabled { opacity: 0.55; cursor: not-allowed; transform: none !important; }
    button::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transform: translateX(-100%);
      transition: transform 0.55s;
    }
    button:hover:not(:disabled)::after { transform: translateX(100%); }
    button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(79,94,43,0.32); }
    button:active:not(:disabled) { transform: translateY(0); }

    #otpMsg {
      margin-top: 14px;
      font-size: 0.87rem;
      font-weight: 600;
      min-height: 20px;
    }

    p { margin-top: 14px; font-size: 0.85rem; color: var(--text-mid); line-height: 1.5; }
    a  { color: var(--primary); font-weight: 600; text-decoration: none; transition: color var(--transition); }
    a:hover { color: var(--accent); }

    #resendBtn {
      background: none;
      box-shadow: none;
      color: var(--primary);
      font-size: 0.85rem;
      font-weight: 600;
      width: auto;
      padding: 0;
      margin-top: 0;
      text-decoration: underline;
      cursor: pointer;
    }
    #resendBtn:hover:not(:disabled) { color: var(--accent); transform: none; box-shadow: none; }
    #resendBtn:disabled { color: var(--text-muted); text-decoration: none; }

    @media (max-width: 900px) {
      .container { flex-direction: column; padding: 32px 24px; gap: 32px; }
      .image-section { width: 100%; }
      .image-section img { max-width: 320px; }
      .card { max-width: 100%; width: 100%; padding: 36px 28px; }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="image-section">
      <img src="pic/car.png" alt="OTP Verification">
    </div>

    <div class="card">
      <h2>Verify OTP</h2>
      <p class="subtitle" id="subtitleMsg">Enter the 6-digit code sent to your email</p>

      <div class="otp-row" id="otpRow">
        <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
        <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
        <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
        <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
        <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
        <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
      </div>

      <div class="timer" id="timerEl">Code expires in <span id="countdown">10:00</span></div>

      <button id="verifyBtn" onclick="verifyOtp()">Verify OTP</button>

      <p id="otpMsg"></p>

      <p>Didn't receive the code? <button id="resendBtn" onclick="resendOtp()" disabled>Resend OTP</button></p>
      <p style="margin-top:10px"><a href="signup.html">← Back to Sign Up</a></p>
    </div>

  </div>

  <script>
    // ── Pre-fill email from sessionStorage ──────────────────
    const pendingEmail = sessionStorage.getItem("pendingEmail") || "";
    if (pendingEmail) {
      document.getElementById("subtitleMsg").textContent =
        `Code sent to ${pendingEmail}`;
    }

    // ── OTP box keyboard behaviour ──────────────────────────
    const boxes = Array.from(document.querySelectorAll("#otpRow input"));

    boxes.forEach((box, i) => {
      box.addEventListener("input", () => {
        box.value = box.value.replace(/[^0-9]/g, "");
        if (box.value) {
          box.classList.add("filled");
          if (i < 5) boxes[i + 1].focus();
        } else {
          box.classList.remove("filled");
        }
      });
      box.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && !box.value && i > 0) {
          boxes[i - 1].focus();
          boxes[i - 1].value = "";
          boxes[i - 1].classList.remove("filled");
        }
      });
      box.addEventListener("paste", (e) => {
        const text = e.clipboardData.getData("text").replace(/\D/g, "").slice(0, 6);
        text.split("").forEach((ch, j) => {
          if (boxes[j]) { boxes[j].value = ch; boxes[j].classList.add("filled"); }
        });
        boxes[Math.min(text.length, 5)].focus();
        e.preventDefault();
      });
    });

    function getOtpValue() {
      return boxes.map(b => b.value).join("");
    }

    // ── Countdown timer (10 min) ────────────────────────────
    let secondsLeft = 600;
    const countdownEl = document.getElementById("countdown");
    const resendBtn   = document.getElementById("resendBtn");

    const timer = setInterval(() => {
      secondsLeft--;
      const m = String(Math.floor(secondsLeft / 60)).padStart(2, "0");
      const s = String(secondsLeft % 60).padStart(2, "0");
      countdownEl.textContent = `${m}:${s}`;
      if (secondsLeft <= 0) {
        clearInterval(timer);
        countdownEl.textContent = "00:00";
        document.getElementById("timerEl").textContent = "Code expired.";
        resendBtn.disabled = false;
      }
    }, 1000);

    // Enable resend after 60 seconds
    setTimeout(() => { resendBtn.disabled = false; }, 60000);

    // ── Verify OTP ──────────────────────────────────────────
    async function verifyOtp() {
      const otp = getOtpValue();
      const otpMsg = document.getElementById("otpMsg");
      const verifyBtn = document.getElementById("verifyBtn");

      if (otp.length < 6) {
        otpMsg.innerText = "Please enter all 6 digits";
        otpMsg.style.color = "red";
        return;
      }
      if (!pendingEmail) {
        otpMsg.innerText = "Session expired. Please sign up again.";
        otpMsg.style.color = "red";
        return;
      }

      verifyBtn.disabled = true;
      verifyBtn.textContent = "Verifying…";

      try {
        const res = await fetch("http://localhost:5001/api/auth/verify-otp", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: pendingEmail, otp })
        });

        const data = await res.json();
        otpMsg.innerText = data.message;
        otpMsg.style.color = res.ok ? "green" : "red";

        if (res.ok) {
          clearInterval(timer);
          sessionStorage.removeItem("pendingEmail");
          setTimeout(() => { window.location.href = "login.html"; }, 1200);
        } else {
          verifyBtn.disabled = false;
          verifyBtn.textContent = "Verify OTP";
        }

      } catch (err) {
        otpMsg.innerText = "Server not responding";
        otpMsg.style.color = "red";
        verifyBtn.disabled = false;
        verifyBtn.textContent = "Verify OTP";
      }
    }

    // ── Resend OTP ──────────────────────────────────────────
    async function resendOtp() {
      const otpMsg = document.getElementById("otpMsg");

      if (!pendingEmail) {
        otpMsg.innerText = "Session expired. Please sign up again.";
        otpMsg.style.color = "red";
        return;
      }

      resendBtn.disabled = true;

      try {
        const res = await fetch("http://localhost:5000/api/auth/resend-otp", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: pendingEmail })
        });

        const data = await res.json();
        otpMsg.innerText = data.message;
        otpMsg.style.color = res.ok ? "green" : "red";

        if (res.ok) {
          // reset timer
          secondsLeft = 600;
          boxes.forEach(b => { b.value = ""; b.classList.remove("filled"); });
          boxes[0].focus();
          // lock resend for another 60s
          setTimeout(() => { resendBtn.disabled = false; }, 60000);
        } else {
          resendBtn.disabled = false;
        }

      } catch (err) {
        otpMsg.innerText = "Server not responding";
        otpMsg.style.color = "red";
        resendBtn.disabled = false;
      }
    }
  </script>

</body>
</html>
