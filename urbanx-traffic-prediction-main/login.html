<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary:       #6b7f3a;
      --primary-dark:  #4f5e2b;
      --primary-light: #9db558;
      --accent:        #f5a623;
      --accent-soft:   rgba(245, 166, 35, 0.15);

      --card-bg:       rgba(255, 253, 225, 0.96);
      --card-border:   rgba(107, 127, 58, 0.18);
      --card-shadow:   0 32px 80px rgba(79, 94, 43, 0.18), 0 4px 16px rgba(79, 94, 43, 0.1);

      --input-bg:      #ffffff;
      --input-border:  rgba(107, 127, 58, 0.22);
      --input-focus:   #6b7f3a;

      --text-dark:     #1e2112;
      --text-mid:      #4a5028;
      --text-muted:    #9a9a7a;

      --radius-pill:   999px;
      --radius-lg:     24px;
      --radius-input:  14px;
      --transition:    0.28s cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Poppins", sans-serif;
      min-height: 100vh;
      background: linear-gradient(145deg, #fdeea0 0%, #fef3bc 40%, #fde88a 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    /* Dot grid */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: radial-gradient(circle, rgba(107,127,58,0.13) 1.5px, transparent 1.5px);
      background-size: 34px 34px;
      pointer-events: none;
      z-index: 0;
    }

    /* Amber orb bottom-left */
    body::after {
      content: '';
      position: fixed; bottom: -100px; left: -100px;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(245,166,35,0.14) 0%, transparent 68%);
      border-radius: 50%;
      animation: driftOrb 18s ease-in-out infinite reverse;
      pointer-events: none;
      z-index: 0;
    }

    /* Olive orb top-right */
    .orb-tr {
      position: fixed; top: -140px; right: -120px;
      width: 580px; height: 580px;
      background: radial-gradient(circle, rgba(107,127,58,0.11) 0%, transparent 68%);
      border-radius: 50%;
      animation: driftOrb 14s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes driftOrb {
      0%,100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(-28px) scale(1.05); }
    }

    .container {
      display: flex;
      width: 100%;
      max-width: 1120px;
      align-items: center;
      justify-content: space-between;
      padding: 0 52px;
      gap: 52px;
      animation: fadeUp 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
      position: relative;
      z-index: 1;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Image side ── */
    .image-section {
      flex: 1.2;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .image-section img {
      width: 100%;
      max-width: 560px;
      border-radius: 0;
      filter: drop-shadow(0 28px 44px rgba(107,127,58,.26)) drop-shadow(0 6px 14px rgba(245,166,35,.18));
      transition: filter 0.4s ease;
    }
    .image-section img:hover {
      filter: drop-shadow(0 32px 52px rgba(107,127,58,.34)) drop-shadow(0 8px 18px rgba(245,166,35,.22));
    }

    /* ── Card ── */
    .card {
      flex: 1;
      max-width: 430px;
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      padding: 52px 44px 44px;
      border-radius: var(--radius-lg);
      border: 1.5px solid var(--card-border);
      box-shadow: var(--card-shadow);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    /* Top gradient stripe */
    .card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary-light), var(--accent), var(--primary));
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    }
    /* Bottom glow */
    .card::after {
      content: '';
      position: absolute; bottom: -50px; left: 50%;
      transform: translateX(-50%);
      width: 300px; height: 130px;
      background: radial-gradient(ellipse, rgba(107,127,58,0.09) 0%, transparent 70%);
      pointer-events: none;
    }


    h2 {
      color: var(--primary-dark);
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.6px;
      margin-bottom: 6px;
    }
    .card-subtitle {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 28px;
      line-height: 1.55;
    }

    /* ── Input labels ── */
    .field { text-align: left; margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--primary-dark);
      letter-spacing: .04em;
      margin-bottom: 5px;
      padding-left: 4px;
    }

    input[type="text"],
    input[type="password"],
    input[type="email"] {
      width: 100%;
      padding: 13px 18px;
      border-radius: var(--radius-input);
      border: 1.5px solid var(--input-border);
      background: var(--input-bg);
      font-family: "Poppins", sans-serif;
      font-size: 0.88rem;
      color: var(--text-dark);
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
      box-shadow: 0 2px 6px rgba(107,127,58,0.06);
    }
    input::placeholder { color: var(--text-muted); font-weight: 400; }
    input:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 4px rgba(107,127,58,0.10), 0 2px 6px rgba(107,127,58,0.06);
      background: #fffef8;
    }

    .password-box { position: relative; }
    .password-box input { padding-right: 48px; }
    .password-box span {
      position: absolute; right: 14px; top: 50%;
      transform: translateY(-50%);
      cursor: pointer; user-select: none;
      opacity: 0.45;
      transition: opacity var(--transition);
    }
    .password-box span:hover { opacity: 0.9; }

    /* ── Divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 4px 0 14px;
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 500;
      letter-spacing: .04em;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(107,127,58,0.18), transparent);
    }

    .remember {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin: 2px 0 22px;
      font-size: 0.83rem;
      color: var(--text-mid);
      cursor: pointer;
    }
    .remember input[type="checkbox"] { width: auto; margin: 0; accent-color: var(--primary); }

    /* ── Button ── */
    button {
      width: 100%;
      padding: 14px;
      margin-top: 4px;
      border-radius: var(--radius-pill);
      border: none;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #fff;
      font-family: "Poppins", sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.4px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform var(--transition), box-shadow var(--transition);
      box-shadow: 0 5px 18px rgba(79,94,43,0.28);
    }
    button::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
      transform: translateX(-100%);
      transition: transform 0.6s ease;
    }
    button:hover::after { transform: translateX(100%); }
    button:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(79,94,43,0.32); }
    button:active { transform: translateY(0); box-shadow: 0 4px 14px rgba(79,94,43,0.25); }

    p { margin-top: 16px; font-size: 0.85rem; color: var(--text-mid); line-height: 1.6; }
    a { color: var(--primary); font-weight: 600; text-decoration: none; transition: color var(--transition); }
    a:hover { color: var(--accent); }

    #loginMsg { min-height: 20px; font-weight: 600; font-size: 0.84rem; }

    @media (max-width: 900px) {
      .container { flex-direction: column; padding: 32px 24px; gap: 28px; }
      .image-section { width: 100%; }
      .image-section img { max-width: 280px; }
      .card { max-width: 100%; width: 100%; padding: 36px 28px; }
    }
  </style>
</head>

<body>
  <div class="orb-tr"></div>

  <div class="container">

    <div class="image-section">
      <img src="pic/car.png" alt="UrbanX mascot welcoming you to login">

    <div class="card">


      <h2>Welcome Back</h2>
      <p class="card-subtitle">Sign in to your account to beat traffic smarter</p>

      <div class="field">
        <label for="loginUser">Email Address</label>
        <input type="email" id="loginUser" placeholder="you@example.com">
      </div>

      <div class="field">
        <label for="loginPass">Password</label>
        <div class="password-box">
          <input type="password" id="loginPass" placeholder="Enter your password">
          <span onclick="togglePass('loginPass')" onmouseover="this.style.opacity='.9'" onmouseout="this.style.opacity='.45'">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6b7f3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </span>
        </div>
      </div>

      <div class="divider">or continue with</div>

      <label class="remember">
        <input type="checkbox"> Remember Me
      </label>

      <button onclick="login()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:6px;margin-top:-2px"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Login
      </button>

      <p>New user? <a href="signup.html">Sign Up</a></p>
      <p id="loginMsg"></p>
    </div>

  </div>

  <script src="auth.js"></script>
</body>

</html>
